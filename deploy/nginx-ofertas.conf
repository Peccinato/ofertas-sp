# nginx na frente do Ofertas SP (Debian)
#
#   sudo cp deploy/nginx-ofertas.conf /etc/nginx/sites-available/ofertas-sp
#   sudo ln -s /etc/nginx/sites-available/ofertas-sp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depois, para HTTPS de graça:  sudo apt install certbot python3-certbot-nginx
#                              sudo certbot --nginx -d ofertas.seudominio.com.br
#
# ATENÇÃO: o app não tem login. Qualquer pessoa que chegar no endereço vê e edita a lista
# da família. Se for abrir para a internet, proteja com uma destas opções:
#   - Cloudflare Tunnel + Access (login do Google para a família);
#   - Tailscale (só os aparelhos da casa enxergam);
#   - a diretiva auth_basic abaixo, com um usuário e senha compartilhados.

server {
    listen 80;
    server_name ofertas.seudominio.com.br;

    # a coleta diária pode demorar; não corte a conexão no meio
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    client_max_body_size 4m;

    # --- proteção opcional por senha (descomente e crie o arquivo com: htpasswd -c /etc/nginx/.htpasswd familia)
    # auth_basic "Ofertas SP";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # o service worker precisa ser servido da raiz e sem cache agressivo,
    # senão o celular fica preso numa versão antiga do app
    location = /sw.js {
        proxy_pass http://127.0.0.1:8765/sw.js;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.json {
        proxy_pass http://127.0.0.1:8765/manifest.json;
        add_header Cache-Control "public, max-age=3600";
    }

    # preços e histórico podem ser cacheados por pouco tempo
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store";
    }
}
