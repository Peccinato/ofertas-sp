<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ofertas SP</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --txt: #1d1d1b; --sub: #6b6b66; --linha: #e6e4de;
    --acento: #0f7b4f; --acento-2: #e7f4ed; --verm: #c2410c; --verm-2: #fdece3; --raio: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --txt: #ecebe7; --sub: #a3a29c; --linha: #33322f;
            --acento: #4ec38d; --acento-2: #1c3328; --verm: #fb8a4c; --verm-2: #3a2418; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--txt); }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--linha); }
  .topo { max-width: 1100px; margin: 0 auto; padding: 12px 16px 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--acento); }
  nav { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; }
  nav button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px; font: inherit; color: var(--sub); cursor: pointer; }
  nav button.ativo { color: var(--txt); border-color: var(--acento); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .painel { display: none; } .painel.ativo { display: block; }
  .barra { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  input[type=search], select { font: inherit; padding: 10px 12px; border: 1px solid var(--linha); border-radius: 10px; background: var(--card); color: var(--txt); }
  input[type=search] { flex: 1; min-width: 200px; }
  button.btn { font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--acento); background: var(--acento); color: #fff; cursor: pointer; font-weight: 600; }
  button.btn.sec { background: var(--card); color: var(--acento); }
  button.btn:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--linha); background: var(--card); color: var(--txt); cursor: pointer; }
  .chip.off { opacity: .4; text-decoration: line-through; }
  .chip .n { color: var(--sub); margin-left: 4px; }
  .info { color: var(--sub); font-size: 13px; margin: 6px 0 12px; }
  .aviso { background: var(--verm-2); color: var(--verm); padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }
  .lista { display: grid; gap: 8px; }
  .item { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--linha); border-radius: var(--raio); padding: 10px 12px; }
  .item img { width: 56px; height: 56px; object-fit: contain; border-radius: 8px; background: #fff; }
  .item .nome { font-weight: 500; }
  .item .nome a { color: inherit; text-decoration: none; } .item .nome a:hover { text-decoration: underline; }
  .meta { font-size: 12.5px; color: var(--sub); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 3px; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 6px; color: #fff; }
  .tag.desc { background: var(--verm-2); color: var(--verm); }
  .tag.fol { background: var(--acento-2); color: var(--acento); }
  .preco { text-align: right; white-space: nowrap; }
  .preco b { font-size: 18px; } .preco s { color: var(--sub); font-size: 12.5px; display: block; }
  .preco small { color: var(--sub); display: block; font-size: 12px; }
  .item.top { border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento) inset; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .grupo-fol { margin-bottom: 28px; }
  .grupo-fol > header { position: static; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: none; border: 0;
                        border-left: 5px solid var(--cor); padding: 4px 0 4px 10px; margin-bottom: 12px; }
  .grupo-fol h3 { margin: 0; font-size: 17px; }
  .grupo-fol .resumo-grupo { color: var(--sub); font-size: 13px; }
  .grupo-fol .ver-produtos { margin-left: auto; font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px;
                             border: 1px solid var(--linha); background: var(--card); color: var(--acento); cursor: pointer; }
  .chip.sel { border-color: var(--acento); color: var(--acento); font-weight: 600; }
  .folheto { background: var(--card); border: 1px solid var(--linha); border-radius: var(--raio); overflow: hidden; }
  .folheto img { width: 100%; aspect-ratio: 3/4; object-fit: cover; object-position: top; display: block; background: #fff; }
  .folheto > div { padding: 8px 10px; font-size: 13px; }
  .folheto .pdf { aspect-ratio: 3/4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: var(--acento-2); color: var(--acento); font-weight: 700; font-size: 28px; text-align: center; padding: 12px; }
  .folheto .pdf small { font-size: 13px; font-weight: 500; color: var(--sub); }
  .folheto a { color: inherit; text-decoration: none; }
  .progresso { height: 6px; background: var(--linha); border-radius: 3px; overflow: hidden; margin: 8px 0; }
  .progresso i { display: block; height: 100%; background: var(--acento); width: 0; transition: width .4s; }
  .vazio { text-align: center; color: var(--sub); padding: 40px 0; }
  /* ações do item: favoritar e pôr na lista */
  .item { grid-template-columns: 56px 1fr auto auto; }
  .acoes { display: flex; flex-direction: column; gap: 4px; }
  .acao { font: inherit; font-size: 17px; line-height: 1; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--linha);
          background: var(--card); color: var(--sub); cursor: pointer; }
  .acao.on { color: #e0a100; border-color: #e0a100; }
  .acao.ok { color: var(--acento); border-color: var(--acento); }
  .seg { display: inline-flex; border: 1px solid var(--linha); border-radius: 999px; overflow: hidden; margin-left: auto; }
  .seg:empty { display: none; }
  .seg button { font: inherit; font-size: 13px; padding: 6px 12px; border: 0; background: var(--card); color: var(--sub); cursor: pointer; }
  .seg button.ativo { background: var(--acento); color: #fff; font-weight: 600; }
  .cep { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--linha);
         background: var(--card); color: var(--txt); cursor: pointer; }
  .cep.vazio-cep { border-color: var(--verm); color: var(--verm); }
  dialog { border: 1px solid var(--linha); border-radius: var(--raio); background: var(--card); color: var(--txt); padding: 18px; width: min(420px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h3 { margin: 0 0 6px; } dialog input { width: 100%; font-size: 18px; letter-spacing: .05em; margin: 10px 0; }
  .sub { color: var(--sub); font-size: 13px; }
  .resumo-cep { margin-top: 10px; font-size: 13px; color: var(--sub); }
  /* favoritos */
  .fav-alt { font-size: 12.5px; margin-top: 4px; color: var(--acento); }
  .fav-alt.pior { color: var(--sub); }
  .var-up { color: var(--verm); font-size: 12px; } .var-down { color: var(--acento); font-size: 12px; }
  /* lista de compras */
  .linha-lista { display: grid; grid-template-columns: auto 64px 1fr auto auto; gap: 10px; align-items: center; background: var(--card);
                 border: 1px solid var(--linha); border-radius: var(--raio); padding: 10px 12px; }
  .linha-lista.feito { opacity: .5; } .linha-lista.feito .txt { text-decoration: line-through; }
  .linha-lista input[type=number] { width: 64px; font: inherit; padding: 6px 8px; border: 1px solid var(--linha); border-radius: 8px; background: var(--card); color: var(--txt); }
  .linha-lista input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--acento); }
  .linha-lista .txt { font-weight: 500; } .linha-lista .onde { font-size: 12.5px; color: var(--sub); margin-top: 2px; }
  .totais { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin: 14px 0; }
  .total { background: var(--card); border: 1px solid var(--linha); border-radius: var(--raio); padding: 10px 12px; }
  .total b { font-size: 18px; display: block; } .total.melhor { border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento) inset; }
  .total .sub { display: block; }
  h2 { font-size: 15px; margin: 18px 0 8px; }
  /* versão online: sem coleta pelo navegador */
  .estatico #btnAtualOf, .estatico #btnAtualFol, .estatico #btnLerFol, .estatico #btnAtualFav, .estatico #lojaAssai,
  .estatico #lblAssai, .estatico #avisoIA, .estatico #refazer, .sem-proxy #btnCepSalvar, .sem-proxy #inpCep { display: none !important; }
  @media (max-width: 560px) {
    .item { grid-template-columns: 44px 1fr auto; } .item img { width: 44px; height: 44px; }
    .preco { grid-column: 2; text-align: left; } .acoes { grid-row: 1 / span 2; grid-column: 3; }
    .linha-lista { grid-template-columns: auto 56px 1fr auto; } .linha-lista .valor { grid-column: 3; }
    nav { overflow-x: auto; } nav button { white-space: nowrap; }
    .grade { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  }
</style>
</head>
<body>
<header>
  <div class="topo"><h1>Ofertas <span>SP</span></h1><span class="info" id="resumo" style="margin:0"></span>
    <div class="seg" id="regioes" role="tablist" aria-label="Região"></div>
    <button class="cep vazio-cep" id="btnCep" type="button">📍 Informe seu CEP</button></div>
  <nav>
    <button class="ativo" data-aba="comparar">Comparar preços</button>
    <button data-aba="ofertas">Ofertas</button>
    <button data-aba="favoritos">★ Favoritos <span id="nFav"></span></button>
    <button data-aba="lista">🛒 Lista <span id="nLista"></span></button>
    <button data-aba="folhetos">Folhetos</button>
  </nav>
</header>
<main>
  <!-- COMPARAR -->
  <section class="painel ativo" id="comparar">
    <form class="barra" id="formBusca">
      <input type="search" id="q" placeholder="Ex.: arroz 5kg, café pilão 500g, leite integral" autofocus>
      <select id="ordem">
        <option value="unidade">Menor preço por kg/L</option>
        <option value="preco">Menor preço</option>
      </select>
      <button class="btn">Buscar</button>
    </form>
    <div class="chips" id="sugestoes"></div>
    <div class="chips" id="filtroMercados"></div>
    <div id="avisoBusca"></div>
    <div class="info" id="infoBusca">Busca nas lojas online de várias redes e nos folhetos já lidos.</div>
    <div class="lista" id="resultado"></div>
  </section>

  <!-- OFERTAS -->
  <section class="painel" id="ofertas">
    <div class="barra">
      <input type="search" id="qOf" placeholder="Filtrar ofertas…">
      <select id="mercadoOf"><option value="">Todos os mercados</option></select>
      <select id="origemOf"><option value="">Site + folheto</option><option value="site">Só sites</option><option value="folheto">Só folhetos</option></select>
      <select id="ordemOf"><option value="desconto">Maior desconto</option><option value="unidade">Menor preço por kg/L</option><option value="preco">Menor preço</option></select>
      <button class="btn sec" id="btnAtualOf">Atualizar ofertas</button>
    </div>
    <div id="progOf"></div>
    <div class="info" id="infoOf"></div>
    <div class="lista" id="listaOf"></div>
  </section>

  <!-- FAVORITOS -->
  <section class="painel" id="favoritos">
    <div class="barra">
      <select id="ordemFav"><option value="nome">Ordem: nome</option><option value="oferta">Em oferta primeiro</option><option value="mercado">Por mercado</option></select>
      <button class="btn sec" id="btnAtualFav">Atualizar preços dos favoritos</button>
    </div>
    <div id="progFav"></div>
    <div class="info" id="infoFav"></div>
    <div class="lista" id="listaFav"></div>
  </section>

  <!-- LISTA DE COMPRAS -->
  <section class="painel" id="lista">
    <form class="barra" id="formLista">
      <input type="search" id="novoItem" placeholder="Adicionar item (ex.: arroz 5kg, leite integral 1L)">
      <input type="number" id="novaQtd" value="1" min="1" style="width:70px;font:inherit;padding:10px;border:1px solid var(--linha);border-radius:10px;background:var(--card);color:var(--txt)">
      <button class="btn">Adicionar</button>
    </form>
    <div class="barra">
      <button class="btn sec" id="btnCalcLista" type="button">Recalcular preços</button>
      <button class="btn sec" id="btnLimparFeitos" type="button">Remover itens marcados</button>
    </div>
    <div class="info" id="infoLista"></div>
    <div class="lista" id="itensLista"></div>
    <h2 id="tituloTotais" hidden>Quanto sai em cada mercado</h2>
    <div class="info" id="infoTotais"></div>
    <div class="totais" id="totais"></div>
  </section>

  <!-- FOLHETOS -->
  <section class="painel" id="folhetos">
    <div class="barra">
      <label class="info" id="lblAssai" style="margin:0">Loja Assaí:</label>
      <select id="lojaAssai"></select>
      <button class="btn sec" id="btnAtualFol">Buscar folhetos novos</button>
      <button class="btn" id="btnLerFol">Ler folhetos com IA</button>
    </div>
    <div id="avisoIA"></div>
    <div id="progFol"></div>
    <div class="info" id="infoFol"></div>
    <div class="chips" id="filtroFol"></div>
    <div id="gradeFol"></div>
  </section>
</main>

<dialog id="dlgCep">
  <form method="dialog" id="formCep">
    <h3>📍 Seu CEP</h3>
    <div class="sub">Os preços e a disponibilidade das lojas online mudam conforme a região. O CEP também escolhe o Assaí mais perto de você.</div>
    <input id="inpCep" inputmode="numeric" placeholder="00000-000" maxlength="9" autocomplete="postal-code">
    <div id="erroCep" class="aviso" hidden></div>
    <div class="barra" style="justify-content:flex-end;margin:0">
      <button class="btn sec" value="cancel" type="button" id="btnCepCancelar">Cancelar</button>
      <button class="btn" id="btnCepSalvar" type="submit">Usar este CEP</button>
    </div>
    <div class="resumo-cep" id="resumoCep"></div>
  </form>
</dialog>

<script>
const CORES = {"Pão de Açúcar":"#b5121b","Tenda Atacado":"#e85d04","Atacadão":"#d62828","Sam's Club":"#0067a0",
  "Mambo":"#2b9348","Oba Hortifruti":"#6a994e","Coop":"#1d4e89","Savegnago":"#c1121f","Zaffari":"#7b2cbf",
  "Assaí":"#f77f00","Roldão":"#003f88","Sonda":"#e30613","Swift":"#c8102e","Akki":"#f4a300",
  "Lopes":"#00843d","Max Atacadista":"#e4002b","Carrefour":"#1e5bc6","Barbosa":"#d71920","Extra":"#e2001a"};
const SUGESTOES = ["arroz 5kg","feijão carioca 1kg","café 500g","leite integral","óleo de soja","açúcar 5kg","ovos","cerveja lata","papel higiênico","sabão em pó"];
const $ = s => document.querySelector(s);
const brl = v => v == null ? "" : v.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let estado = {produtos: [], ocultos: new Set(), status: null};
const chave = p => p.mercado + "|" + p.nome;
const vistos = new Map();   // chave -> produto exibido (para os botões de favoritar / pôr na lista)

// ---------- modo online (GitHub Pages): sem servidor, responde as rotas /api com os dados coletados no dia
const semAcento = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
// ---------- regiões (SP - São Paulo, SP - Paulínia): cada uma com suas redes e seu CEP padrão
const Regiao = {
  lista: {},   // id -> {nome, cep, online, folhetos, local}
  atual: (() => { try { return localStorage.getItem("ofertas-regiao") || "sp"; } catch { return "sp"; } })(),
  def() { return this.lista[this.atual] || {online: [], folhetos: []}; },
  redes() { const r = this.def(); return new Set([...(r.online || []), ...(r.folhetos || [])]); },
  tem(m) { return !Object.keys(this.lista).length || this.redes().has(m); },
};

const Estatico = {
  ativo: false, produtos: [], folhetos: [], assai: [], lidos: {}, meta: {},
  async iniciar() {
    try {
      const r = await fetch("dados/meta.json", {cache: "no-cache"});
      if (!r.ok) return;
      this.meta = await r.json();
    } catch { return; }
    this.ativo = true;
    const json = (n, padrao) => fetch("dados/" + n, {cache: "no-cache"}).then(r => r.json()).catch(() => padrao);
    const [prods, fols, assai, lidos] = await Promise.all([
      json("produtos.json", {colunas: [], linhas: []}), json("folhetos.json", []), json("assai.json", []), json("folhetos-lidos.json", {}),
    ]);
    const cols = prods.colunas;
    this.produtos = prods.linhas.map(l => preparar(Object.fromEntries(cols.map((c, i) => [c, l[i]]))))
      .filter(p => p.origem !== "folheto");   // itens de folheto vêm de `lidos`, conforme a região do usuário
    this.folhetos = fols.filter(f => f.mercado !== "Assaí");
    this.assai = assai; this.lidos = lidos;
    if (this.meta.regioes) Regiao.lista = this.meta.regioes;
    if (!Regiao.lista[Regiao.atual]) Regiao.atual = "sp";
    AoVivo.iniciar(this.meta.proxy);
    document.body.classList.add("estatico");
    if (!AoVivo.ativo) document.body.classList.add("sem-proxy");
  },
  // folhetos da região: Assaí da loja mais próxima do CEP do usuário + as demais redes
  folhetosDaRegiao() {
    const loja = Regiao.tem("Assaí") ? AoVivo.lojaAssai() : null;
    const assai = loja ? this.assai.filter(f => f.lojas.includes(loja.id)).map(f => ({...f, loja: loja.nome})) : [];
    return [...assai, ...this.folhetos.filter(f => Regiao.tem(f.mercado))].map(f => {
      const itens = this.lidos[f.imagem];
      return {...f, status: itens ? "lido" : "pendente", n_itens: itens ? itens.length : 0};
    });
  },
  produtosDeFolheto() {
    const chaveFol = Regiao.atual + ":" + AoVivo.lojaAssai()?.id;
    if (this._fol && this._folChave === chaveFol) return this._fol;
    this._folChave = chaveFol;
    this._fol = this.folhetosDaRegiao().flatMap(f => (this.lidos[f.imagem] || []).filter(i => i.nome && i.preco).map(i => preparar(finalizar({
      mercado: f.mercado, nome: i.nome, preco: +i.preco, preco_de: i.preco_de, marca: "", imagem: f.imagem, url: f.imagem,
      origem: "folheto", validade: f.validade || "", extra: i.condicao || "",
    }))));
    return this._fol;
  },
  todos() { return [...this.produtos.filter(p => Regiao.tem(p.mercado)), ...this.produtosDeFolheto()]; },
  consultar(q = "", {mercado = "", origem = "", soOfertas = false, limite = 600, lista = null} = {}) {
    const raizes = raizesBusca(q);
    return (lista || this.todos()).filter(p => raizes.every(r => p.nome_busca.includes(r))
        && (!mercado || p.mercado === mercado) && (!origem || p.origem === origem)
        && (!soOfertas || p.desconto > 0 || p.origem === "folheto" || p.extra))
      .sort((a, b) => (a.preco_unidade ?? a.preco) - (b.preco_unidade ?? b.preco)).slice(0, limite);
  },
  porChave(k) { return this.todos().find(p => chave(p) === k) || null; },
  // produtos para um termo: ao vivo (com o CEP do usuário) quando há proxy, senão os coletados no dia
  async produtosPara(termo) {
    if (!AoVivo.ativo) return {produtos: this.consultar(termo), erros: {}};
    const r = await AoVivo.buscar(termo);
    return {produtos: this.consultar(termo, {lista: [...r.produtos, ...this.produtosDeFolheto()]}), erros: r.erros};
  },
  async responder(caminho, corpo) {
    const u = new URL(caminho, location.href), q = Object.fromEntries(u.searchParams);
    const custoP = p => p.preco_unidade || p.preco;
    switch (u.pathname.replace(/^.*\/api\//, "")) {
      case "status": return {estatico: true, trabalho: {tarefa: "", feito: 0, total: 0, erros: [], fim: 1}, ia: true, ia_motivo: "",
        contagens: [{n: this.todos().length}], lojas_assai: [], loja_assai_id: 0, regioes: this.meta.regioes,
        mercados_online: Regiao.def().online || this.meta.mercados_online || [], mercados_folheto: Regiao.def().folhetos || this.meta.mercados_folheto || []};
      case "buscar": return q.q ? this.produtosPara(q.q) : {produtos: [], erros: {}};
      case "ofertas": return {produtos: this.consultar(q.q || "", {mercado: q.mercado, origem: q.origem, soOfertas: true, limite: 2000})};
      case "folhetos": return {folhetos: this.folhetosDaRegiao()};
      case "local":
        if (corpo) {
          if (!AoVivo.ativo) return {erro: "Na versão online o CEP é fixo (definido na coleta diária). Para usar o seu CEP, abra o app no PC."};
          try { await AoVivo.definirCep(corpo.cep); this._fol = null; return AoVivo.info(); } catch (e) { return {erro: e.message}; }
        }
        return AoVivo.ativo && AoVivo.local ? AoVivo.info() : (Regiao.def().local || this.meta.local || {endereco: null});
      case "dados": throw new Error("sem servidor");   // favoritos e lista ficam só no aparelho
      case "favoritos/precos": {
        const out = {};
        for (const f of corpo.favoritos || []) {
          const {produtos} = await this.produtosPara(f.termo || f.nome);
          const atual = produtos.find(p => chave(p) === f.k) || (AoVivo.ativo ? null : this.porChave(f.k));
          let alts = produtos.filter(p => chave(p) !== f.k);
          let c = p => p.preco;
          if (atual?.preco_unidade) { alts = alts.filter(p => p.preco_unidade && p.unidade === atual.unidade); c = p => p.preco_unidade; }
          out[f.k] = {atual, alternativa: alts.length ? alts.reduce((a, b) => c(b) < c(a) ? b : a) : null};
        }
        return out;
      }
      case "lista/precos": return {itens: await Promise.all((corpo.itens || []).map(async it => {
        const {produtos} = await this.produtosPara(it.texto || "");
        const por_mercado = {};
        for (const p of produtos)
          if (!por_mercado[p.mercado] || custoP(p) < custoP(por_mercado[p.mercado])) por_mercado[p.mercado] = p;
        const v = Object.values(por_mercado);
        return {por_mercado, melhor: v.length ? v.reduce((a, b) => custoP(b) < custoP(a) ? b : a) : null,
                fixo: it.prod ? (produtos.find(p => chave(p) === it.prod.k) || null) : null};
      }))};
      default: return {erro: "Disponível só no app do PC."};
    }
  },
};

// ---------- utilidades compartilhadas (mesma lógica do Python em coletores/base.py e db.py)
function raizesBusca(q) {
  return semAcento(q).split(/\s+/).filter(w => w.length >= 2).map(w => {
    let r = w.length > 4 && w.endsWith("s") ? w.slice(0, -1) : w;
    return r.length > 4 && "aeo".includes(r.at(-1)) ? r.slice(0, -1) : r;
  });
}
function preparar(p) { p.nome_busca = semAcento(p.nome + " " + (p.marca || "")); return p; }
function quantidade(nome) {
  const re = /(?:(\d+)\s*(?:x|un\w*\s*de)\s*)?(\d+(?:[.,]\d+)?)\s*(kg|kilo|g|gr|gramas|mg|l|lt|litros?|ml)\b/gi;
  let m, ult = null;
  while ((m = re.exec(semAcento(nome)))) ult = m;
  if (!ult) return [null, ""];
  const v = parseFloat(ult[2].replace(",", ".")) * (ult[1] ? +ult[1] : 1), u = ult[3].toLowerCase();
  if (["g", "gr", "gramas"].includes(u)) return [v / 1000, "kg"];
  if (u === "mg") return [null, ""];
  if (["kg", "kilo"].includes(u)) return [v, "kg"];
  if (u === "ml") return [v / 1000, "L"];
  return [v, "L"];
}
function finalizar(p) {
  p.desconto = 0;
  if (p.preco_de && p.preco_de > p.preco && p.preco > 0) p.desconto = Math.round(100 * (1 - p.preco / p.preco_de));
  else p.preco_de = null;
  const [qtd, un] = quantidade(p.nome);
  p.unidade = qtd && p.preco ? un : ""; p.preco_unidade = qtd && p.preco ? Math.round(p.preco / qtd * 100) / 100 : null;
  return p;
}
const reais = v => "R$ " + v.toFixed(2).replace(".", ",");

// ---------- busca ao vivo nas lojas, pelo proxy do Cloudflare, com o CEP de cada aparelho
const VTEX_LOJAS = {"Atacadão": "www.atacadao.com.br", "Sam's Club": "www.samsclub.com.br", "Mambo": "www.mambo.com.br",
  "Oba Hortifruti": "www.obahortifruti.com.br", "Coop": "www.coopsupermercado.com.br", "Savegnago": "www.savegnago.com.br",
  "Zaffari": "www.zaffari.com.br", "Swift": "www.swift.com.br", "Covabra": "www.covabra.com.br", "BOA": "boa.vtexcommercestable.com.br"};
const VTEX_SITE = {"boa.vtexcommercestable.com.br": "www.boasupermercados.com.br"};   // API em outro domínio que a loja
const AoVivo = {
  ativo: false, proxy: "", local: null, cache: new Map(),
  iniciar(proxy) {
    this.proxy = (proxy || "").replace(/\/$/, ""); this.ativo = !!this.proxy;

  },
  // cada região guarda o próprio CEP; sem CEP salvo, usa o da coleta diária daquela região
  chaveLocal() { return Regiao.atual === "sp" ? "ofertas-local" : "ofertas-local-" + Regiao.atual; },
  carregarLocal() {
    this.local = null; this.cache.clear();
    try { this.local = JSON.parse(localStorage.getItem(this.chaveLocal()) || "null"); } catch {}
    const padrao = Regiao.def();   // CEP e lojas usados na coleta diária da região
    if (!this.local && padrao.local?.endereco) this.local = {endereco: padrao.local.endereco, regiao: padrao.regiao_lojas || {}, padrao: true};
  },
  async pedir(url, corpo) {
    const r = await fetch(this.proxy + "/?url=" + encodeURIComponent(url), corpo
      ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(corpo)} : {});
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r;
  },
  json(url, corpo) { return this.pedir(url, corpo).then(r => r.json()); },
  lojaAssai() {
    const l = this.local?.endereco?.assai?.[0];
    if (l) return l;
    const padrao = (Regiao.def().local || Estatico.meta.local)?.endereco?.assai?.[0];
    return padrao || null;
  },
  info() {
    const e = this.local?.endereco, reg = this.local?.regiao || {};
    return {endereco: e, redes_regionalizadas: Object.fromEntries(Object.entries(VTEX_LOJAS).map(([n, h]) => [n, !!reg.vtex?.[h]])),
            pao_de_acucar: reg.gpa?.nome || null, extra: reg.extra?.nome || null};
  },
  async definirCep(cepTxt) {
    const cep = (cepTxt || "").replace(/\D/g, "");
    if (cep.length !== 8) throw new Error("CEP deve ter 8 números");
    const e = {cep, rua: "", bairro: "", cidade: "", uf: "", lat: null, lon: null};
    try {
      const d = await fetch(`https://brasilapi.com.br/api/cep/v2/${cep}`).then(r => { if (!r.ok) throw 0; return r.json(); });
      Object.assign(e, {rua: d.street || "", bairro: d.neighborhood || "", cidade: d.city || "", uf: d.state || ""});
      const c = Object.fromEntries(Object.entries(d.location?.coordinates || {}).map(([k, v]) => [k, +v]));
      // a BrasilAPI devolve o marco zero de SP quando não sabe a coordenada exata: nesse caso usa o OpenStreetMap
      const generica = Math.abs(c.latitude + 23.5475) < 0.002 && Math.abs(c.longitude + 46.6361) < 0.002;
      if (c.latitude && c.longitude && !generica) Object.assign(e, {lat: +c.latitude, lon: +c.longitude});
    } catch {
      const d = await fetch(`https://viacep.com.br/ws/${cep}/json/`).then(r => r.json()).catch(() => ({erro: true}));
      if (d.erro) throw new Error("CEP não encontrado");
      Object.assign(e, {rua: d.logradouro || "", bairro: d.bairro || "", cidade: d.localidade || "", uf: d.uf || ""});
    }
    if (e.lat == null && e.cidade) {
      // rua + bairro (o bairro evita ruas homônimas em outro lado da cidade), senão só o bairro
      for (const q of [[e.rua, e.bairro, e.cidade, e.uf], [e.bairro, e.cidade, e.uf]].map(l => l.filter(Boolean).join(", "))) {
        try {
          const r = await fetch("https://nominatim.openstreetmap.org/search?" + new URLSearchParams({q, countrycodes: "br", format: "json", limit: 1})).then(r => r.json());
          if (r.length) { e.lat = +r[0].lat; e.lon = +r[0].lon; break; }
        } catch {}
      }
    }
    // região de entrega de cada rede
    const regiao = {vtex: {}, gpa: null, extra: null};
    await Promise.all([
      ...Object.values(VTEX_LOJAS).map(h => this.json(`https://${h}/api/checkout/pub/regions?country=BRA&postalCode=${cep}`)
        .then(r => { regiao.vtex[h] = r[0]?.id || ""; }).catch(() => {})),
      ...[["pa", "gpa"], ["ex", "extra"]].map(([rede, k]) => this.json(`https://api.vendas.gpa.digital/${rede}/delivery/options?zipCode=${cep}`).then(d => {
        const t = d.content?.deliveryTypes?.[0]; if (t) regiao[k] = {id: t.storeid, nome: t.storeName || ""};
      }).catch(() => {})),
    ]);
    // Assaí mais próximo
    if (e.lat != null) {
      const rad = Math.PI / 180, dist = l => 12742 * Math.asin(Math.sqrt(0.5 - Math.cos((l.lat - e.lat) * rad) / 2
        + Math.cos(e.lat * rad) * Math.cos(l.lat * rad) * (1 - Math.cos((l.lon - e.lon) * rad)) / 2));
      e.assai = (Estatico.meta.assai_lojas || []).map(l => ({...l, km: Math.round(dist(l) * 10) / 10})).sort((a, b) => a.km - b.km).slice(0, 5);
    }
    this.local = {endereco: e, regiao};
    this.cache.clear();
    try { localStorage.setItem(this.chaveLocal(), JSON.stringify(this.local)); } catch {}
  },
  // busca o termo nas 11 lojas ao mesmo tempo; guarda o resultado por 30 min
  async buscar(termo, n = 24) {
    const k = Regiao.atual + ":" + semAcento(termo).trim(), salvo = this.cache.get(k);
    if (salvo && Date.now() - salvo.t < 30 * 60e3) return salvo.r;
    const fontes = {"Pão de Açúcar": () => this.gpa("Pão de Açúcar", termo, n), "Extra": () => this.gpa("Extra", termo, n), "Tenda Atacado": () => this.tenda(termo, n), "Sonda": () => this.sonda(termo, n),
      "Carrefour": () => this.carrefour(termo, n), "Pague Menos": () => this.paguemenos(termo, n),
      ...Object.fromEntries(Object.entries(VTEX_LOJAS).map(([m, h]) => [m, () => this.vtex(m, h, termo, n)]))};
    for (const m of Object.keys(fontes)) if (!Regiao.tem(m)) delete fontes[m];   // só as redes da região
    const produtos = [], erros = {};
    await Promise.all(Object.entries(fontes).map(async ([m, f]) => {
      try { produtos.push(...(await f()).map(p => preparar(finalizar({origem: "site", validade: "", extra: "", marca: "", imagem: "", ...p})))); }
      catch (e) { erros[m] = e.message; }

  async vtex(mercado, host, termo, n) {

  async gpa(mercado, termo, n) {

async function apiFetch(caminho, opts = {}) {
  if (/^\/api\/(buscar|ofertas|folhetos)\b/.test(caminho)) caminho += (caminho.includes("?") ? "&" : "?") + "regiao=" + Regiao.atual;
  if (!Estatico.ativo) return fetch(caminho, opts);
  const corpo = opts.body ? JSON.parse(opts.body) : (opts.method === "POST" ? {} : null);
  const dados = await Estatico.responder(caminho, corpo);
  return {ok: true, json: async () => dados};
}

const Dados = {
  d: {favoritos: [], lista: []},

    let local = null;

    try { this.d = await apiFetch("/api/dados").then(r => r.json()); } catch { this.d = local || {}; }
    if (!this.d.favoritos && local) this.d = local;
    this.d.favoritos ||= []; this.d.lista ||= [];

// termo de busca genérico a partir do nome: "Arroz Agulhinha Tipo 1 CAMIL 5kg" -> "arroz agulhinha 5kg"
function termoDe(nome) {
  const palavras = nome.toLowerCase().replace(/[^\p{L}\p{N}\s,.]/gu, " ").split(/\s+/).filter(Boolean);
  const tam = (nome.match(/\d+(?:[.,]\d+)?\s*(?:kg|g|ml|l|litros?)\b/i) || [""])[0].replace(/\s+/g, "").toLowerCase();
  const base = palavras.filter(w => w.length > 2 && !/\d/.test(w) && !["tipo", "pacote", "com", "sem", "para", "de", "do", "da"].includes(w)).slice(0, 2);
  return [...base, tam].filter(Boolean).join(" ");
}

function alternarFavorito(p, termo) {
  const k = chave(p);
  if (Dados.ehFav(k)) Dados.d.favoritos = Dados.d.favoritos.filter(f => f.k !== k);
  else Dados.d.favoritos.push({k, mercado: p.mercado, nome: p.nome, url: p.url, imagem: p.origem === "folheto" ? "" : p.imagem,
    preco: p.preco, termo: termo || termoDe(p.nome), em: new Date().toISOString().slice(0, 10)});
  Dados.salvar();
}
function adicionarNaLista(p, termo) {
  const k = chave(p);
  if (Dados.naLista(k)) return;
  Dados.d.lista.push({id: Date.now() + Math.random(), texto: termo || termoDe(p.nome), qtd: 1, feito: false,
    prod: {k, mercado: p.mercado, nome: p.nome}});
  Dados.salvar();
}

  if (b.dataset.aba === "lista") desenharLista(), calcularLista();
});

function acoesHTML(p) {
  const k = chave(p); vistos.set(k, p);
  const fav = Dados.ehFav(k), lst = Dados.naLista(k);
  return `<div class="acoes">
    <button class="acao${fav ? " on" : ""}" data-acao="fav" data-k="${esc(k)}" title="Favoritar" type="button">${fav ? "★" : "☆"}</button>
    <button class="acao${lst ? " ok" : ""}" data-acao="lista" data-k="${esc(k)}" title="Pôr na lista de compras" type="button">${lst ? "✓" : "🛒"}</button></div>`;
}

function itemHTML(p, destaque, extraHTML = "") {
  const cor = CORES[p.mercado] || "#555";
  const unid = p.preco_unidade ? `<small>${brl(p.preco_unidade)}/${p.unidade}</small>` : "";
  const de = p.preco_de ? `<s>${brl(p.preco_de)}</s>` : "";
  const tags = [
    `<span class="tag" style="background:${cor}">${esc(p.mercado)}</span>`,
    p.desconto > 0 ? `<span class="tag desc">-${Math.round(p.desconto)}%</span>` : "",
    p.origem === "folheto" ? `<span class="tag fol">folheto</span>` : "",
    p.extra ? `<span>${esc(p.extra)}</span>` : "",
    p.validade ? `<span>${esc(p.validade)}</span>` : "",
  ].join("");
  const img = p.origem === "folheto" ? "" : esc(p.imagem);
  return `<div class="item${destaque ? " top" : ""}">
    ${img ? `<img loading="lazy" src="${img}" alt="">` : `<img alt="" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'/>">`}
    <div><div class="nome"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.nome)}</a></div><div class="meta">${tags}</div>${extraHTML}</div>
    <div class="preco">${de}<b>${brl(p.preco)}</b>${unid}</div>${acoesHTML(p)}</div>`;
}

function ordenar(lista, ordem) {
  const k = ordem === "desconto" ? p => -(p.desconto || 0)
          : ordem === "unidade" ? p => p.preco_unidade ?? p.preco * 1000
          : p => p.preco;
  return [...lista].sort((a, b) => k(a) - k(b));
}

async function buscar(forcar) {

  $("#infoBusca").textContent = "Buscando em todas as redes…"; $("#resultado").innerHTML = ""; $("#avisoBusca").innerHTML = "";
  const r = await apiFetch(`/api/buscar?q=${encodeURIComponent(q)}${forcar ? "&forcar=1" : ""}`).then(r => r.json());
  if (r.erro) { $("#infoBusca").textContent = "Erro: " + r.erro; return; }
  estado.produtos = r.produtos;

function desenharBusca() {
  const todos = estado.produtos;
  const cont = {}; todos.forEach(p => cont[p.mercado] = (cont[p.mercado] || 0) + 1);

let folhetosAtuais = [], filtroFol = "";
async function carregarFolhetos() {

function desenharFolhetos() {
  const fs = folhetosAtuais;
  // agrupa por mercado, em ordem alfabética
  const grupos = {};
  fs.forEach(f => (grupos[f.mercado] ||= []).push(f));
  const mercados = Object.keys(grupos).sort((a, b) => a.localeCompare(b, "pt-BR"));
  if (filtroFol && !grupos[filtroFol]) filtroFol = "";
  $("#infoFol").textContent = fs.length ? `${fs.length} páginas de folhetos vigentes em ${mercados.length} mercados. Toque numa página para abrir em tamanho real.`
                                        : "Nenhum folheto carregado. Clique em “Buscar folhetos novos”.";
  $("#filtroFol").innerHTML = fs.length ? [`<button class="chip${filtroFol ? "" : " sel"}" data-m="" type="button">Todos<span class="n">${fs.length}</span></button>`,
    ...mercados.map(m => `<button class="chip${filtroFol === m ? " sel" : ""}" data-m="${esc(m)}" type="button"><span style="color:${CORES[m] || "inherit"}">●</span> ${esc(m)}<span class="n">${grupos[m].length}</span></button>`)].join("") : "";
  $("#gradeFol").innerHTML = mercados.filter(m => !filtroFol || m === filtroFol).map(m => {
    const lista = grupos[m], cor = CORES[m] || "#555";
    const itens = lista.reduce((t, f) => t + (f.n_itens || 0), 0), lidas = lista.filter(f => f.status === "lido").length;
    const cards = lista.map(f => {
      const st = f.status === "lido" ? `<span class="tag fol">${f.n_itens} produtos lidos</span>`
               : f.status === "erro" ? `<span class="tag desc" title="${esc(f.erro)}">erro na leitura</span>` : `<span class="meta">ainda não lido</span>`;
      const capa = /\.pdf$/i.test(f.imagem) ? `<div class="pdf">PDF<small>${esc(f.titulo)}</small></div>` : `<img loading="lazy" src="${esc(f.imagem)}" alt="">`;
      return `<div class="folheto"><a href="${esc(f.imagem)}" target="_blank" rel="noopener">${capa}</a>
        <div><b>${esc(f.titulo)}</b>${f.pagina > 1 || lista.filter(x => x.titulo === f.titulo).length > 1 ? ` · pág. ${f.pagina}` : ""}
        ${f.loja ? `<div class="meta">${esc(f.loja)}</div>` : ""}<div class="meta">${esc(f.validade)}</div><div class="meta">${st}</div></div></div>`;
    }).join("");
    return `<section class="grupo-fol" style="--cor:${cor}"><header>
        <span class="tag" style="background:${cor}">${esc(m)}</span>
        <span class="resumo-grupo">${lista.length} página${lista.length > 1 ? "s" : ""} · ${lidas === lista.length ? "todas lidas" : `${lidas} lida${lidas === 1 ? "" : "s"}`} · ${itens} produtos</span>
        ${itens ? `<button class="ver-produtos" data-m="${esc(m)}" type="button">Ver produtos com preço →</button>` : ""}
      </header><div class="grade">${cards}</div></section>`;
  }).join("");
}

const custo = p => p.preco_unidade ?? p.preco;
async function carregarFavoritos() {
  const favs = Dados.d.favoritos;
  if (!favs.length) {
    $("#infoFav").textContent = "Nenhum favorito ainda. Toque na ☆ de qualquer produto (em Comparar ou Ofertas) para acompanhar o preço dele aqui.";
    $("#listaFav").innerHTML = ""; return;
  }
  $("#infoFav").textContent = "Carregando preços…";
  const r = await apiFetch("/api/favoritos/precos", {method: "POST", body: JSON.stringify({favoritos: favs})}).then(r => r.json());
  let linhas = favs.map(f => ({f, ...(r[f.k] || {})}));
  const ord = $("#ordemFav").value;
  if (ord === "oferta") linhas.sort((a, b) => ((b.atual?.desconto || 0) - (a.atual?.desconto || 0)));
  else if (ord === "mercado") linhas.sort((a, b) => a.f.mercado.localeCompare(b.f.mercado) || a.f.nome.localeCompare(b.f.nome));
  else linhas.sort((a, b) => a.f.nome.localeCompare(b.f.nome));
  const emOferta = linhas.filter(l => l.atual?.desconto > 0).length;
  $("#infoFav").textContent = `${favs.length} favoritos${emOferta ? ` · ${emOferta} em oferta agora` : ""}. Os preços vêm da última busca; use “Atualizar preços” para buscar de novo.`;
  $("#listaFav").innerHTML = linhas.map(({f, atual, alternativa}) => {
    const p = atual || {mercado: f.mercado, nome: f.nome, url: f.url, imagem: f.imagem, preco: f.preco, origem: "site"};
    let extra = "";
    if (!atual) extra += `<div class="fav-alt pior">Sem preço recente nesta rede (pode ter saído do site). Mostrando o preço de quando você favoritou.</div>`;
    else if (f.preco && Math.abs(atual.preco - f.preco) >= 0.01) {
      const sobe = atual.preco > f.preco;
      extra += `<div class="${sobe ? "var-up" : "var-down"}">${sobe ? "▲ subiu" : "▼ caiu"} ${brl(Math.abs(atual.preco - f.preco))} desde ${f.em.split("-").reverse().join("/")} (era ${brl(f.preco)})</div>`;
    }
    if (alternativa && (!atual || custo(alternativa) < custo(atual))) {
      const u = alternativa.preco_unidade && atual?.preco_unidade ? `${brl(alternativa.preco_unidade)}/${alternativa.unidade}` : brl(alternativa.preco);
      extra += `<div class="fav-alt">💡 Parecido mais barato: <b>${u}</b> no ${esc(alternativa.mercado)} — <a href="${esc(alternativa.url)}" target="_blank" rel="noopener">${esc(alternativa.nome)}</a></div>`;
    }
    return itemHTML(p, false, extra);
  }).join("");
}

let precosLista = {};   // id do item -> {melhor, por_mercado, fixo}
function desenharLista() {
  const itens = Dados.d.lista;
  $("#infoLista").textContent = itens.length ? "" : "Lista vazia. Adicione itens acima ou toque no 🛒 de qualquer produto.";
  $("#itensLista").innerHTML = itens.map(i => {
    const pr = precosLista[i.id] || {};
    const usado = pr.fixo || pr.melhor;
    let onde = "<span class='sub'>buscando preço…</span>";
    if (pr.calculado && !usado) onde = "Não encontrado nas lojas online. Tente um nome mais simples.";
    else if (usado) {
      onde = `${pr.fixo ? "Escolhido" : "Mais barato"}: <b>${esc(usado.mercado)}</b> — ${esc(usado.nome)} (${brl(usado.preco)}${usado.preco_unidade ? `, ${brl(usado.preco_unidade)}/${usado.unidade}` : ""})`;
      if (pr.fixo && pr.melhor && custo(pr.melhor) < custo(pr.fixo) && chave(pr.melhor) !== chave(pr.fixo))
        onde += `<br>💡 Mais barato: ${esc(pr.melhor.mercado)} — ${esc(pr.melhor.nome)} (${brl(pr.melhor.preco)})`;
    } else if (i.prod) onde = `Escolhido: <b>${esc(i.prod.mercado)}</b> — ${esc(i.prod.nome)}`;
    return `<div class="linha-lista${i.feito ? " feito" : ""}" data-id="${i.id}">
      <input type="checkbox" data-c="feito"${i.feito ? " checked" : ""} title="Já peguei">
      <input type="number" min="1" value="${i.qtd}" data-c="qtd" title="Quantidade">
      <div><div class="txt">${esc(i.texto)}</div><div class="onde">${onde}</div></div>
      <div class="preco valor"><b>${usado ? brl(usado.preco * i.qtd) : ""}</b></div>
      <button class="acao" data-c="del" title="Remover" type="button">✕</button></div>`;
  }).join("");
  desenharTotais();
}
function desenharTotais() {
  const itens = Dados.d.lista.filter(i => !i.feito && precosLista[i.id]?.calculado);
  if (!itens.length) { $("#tituloTotais").hidden = true; $("#totais").innerHTML = ""; $("#infoTotais").textContent = ""; return; }
  const mercados = {};
  let melhorTotal = 0, achados = 0;
  for (const i of itens) {
    const pr = precosLista[i.id];
    const usado = pr.fixo || pr.melhor;
    if (usado) { melhorTotal += usado.preco * i.qtd; achados++; }
    // compara a mesma quantidade: se o item é "arroz 5kg", um mercado que só tem 1kg entra com o preço de 5kg
    const qRef = usado && usado.preco_unidade ? usado.preco / usado.preco_unidade : null;
    for (const [m, p] of Object.entries(pr.por_mercado || {})) {
      const mesmo = qRef && p.preco_unidade && p.unidade === usado.unidade;
      mercados[m] ||= {total: 0, n: 0};
      mercados[m].total += (mesmo ? p.preco_unidade * qRef : p.preco) * i.qtd; mercados[m].n++;
    }
  }
  const ranking = Object.entries(mercados).sort((a, b) => (b[1].n - a[1].n) || (a[1].total - b[1].total));
  $("#tituloTotais").hidden = false;
  $("#infoTotais").textContent = `Para ${itens.length} itens pendentes. Cada mercado entra com a opção mais barata (por kg/L) que ele tem de cada item, na mesma quantidade do item escolhido.`;
  $("#totais").innerHTML =
    `<div class="total melhor"><span class="sub">Comprando o mais barato de cada item</span><b>${brl(melhorTotal)}</b><span class="sub">${achados} de ${itens.length} itens · vários mercados</span></div>` +
    ranking.map(([m, t], idx) => `<div class="total"><span class="tag" style="background:${CORES[m] || "#555"}">${esc(m)}</span>
      <b>${brl(t.total)}</b><span class="sub">${t.n} de ${itens.length} itens${t.n < itens.length ? " (faltam " + (itens.length - t.n) + ")" : ""}${idx === 0 && t.n === itens.length ? " · melhor num lugar só" : ""}</span></div>`).join("");
}
let calcId = 0;
async function calcularLista() {
  const itens = Dados.d.lista.filter(i => !precosLista[i.id]?.calculado || calcularLista.forcar);
  calcularLista.forcar = false;
  if (!itens.length) return desenharLista();
  const meu = ++calcId;
  $("#infoLista").textContent = `Buscando preços de ${itens.length} item(ns) em todas as redes…`;
  const r = await apiFetch("/api/lista/precos", {method: "POST", body: JSON.stringify({itens: itens.map(i => ({texto: i.texto, prod: i.prod}))})}).then(r => r.json());
  if (meu !== calcId) return;
  (r.itens || []).forEach((res, n) => precosLista[itens[n].id] = {...res, calculado: true});
  $("#infoLista").textContent = "";
  desenharLista();
}
$("#formLista").onsubmit = e => {

  Dados.d.lista.push({id: Date.now() + Math.random(), texto, qtd: Math.max(1, +$("#novaQtd").value || 1), feito: false});

$("#formCep").onsubmit = async e => {
  e.preventDefault();
  $("#btnCepSalvar").disabled = true; $("#btnCepSalvar").textContent = "Localizando…"; $("#erroCep").hidden = true;
  const r = await apiFetch("/api/local", {method: "POST", body: JSON.stringify({cep: $("#inpCep").value})}).then(r => r.json()).catch(() => ({erro: "sem conexão"}));
  $("#btnCepSalvar").disabled = false; $("#btnCepSalvar").textContent = "Usar este CEP";

};
function montarLojasAssai(s) {
  $("#lojaAssai").innerHTML = s.lojas_assai.map(l => `<option value="${l.id}"${l.id === s.loja_assai_id ? " selected" : ""}>${esc(l.nome)}</option>`).join("");
}

// ---------- troca de região
function desenharRegioes() {
  const ids = Object.keys(Regiao.lista);
  $("#regioes").innerHTML = ids.length > 1 ? ids.map(id => `<button type="button" role="tab" data-r="${id}" class="${id === Regiao.atual ? "ativo" : ""}"
    aria-selected="${id === Regiao.atual}">${esc(Regiao.lista[id].nome)}</button>`).join("") : "";
}
function montarMercadosOf() {
  const sel = $("#mercadoOf").value, r = Regiao.def();
  const mercados = [...new Set([...(r.online || []), ...(r.folhetos || [])])].sort((a, b) => a.localeCompare(b, "pt-BR"));
  $("#mercadoOf").innerHTML = `<option value="">Todos os mercados</option>` + mercados.map(m => `<option${m === sel ? " selected" : ""}>${esc(m)}</option>`).join("");
}
$("#regioes").onclick = async e => {
  const b = e.target.closest("[data-r]"); if (!b || b.dataset.r === Regiao.atual) return;
  Regiao.atual = b.dataset.r;
  try { localStorage.setItem("ofertas-regiao", Regiao.atual); } catch {}
  desenharRegioes(); montarMercadosOf();
  if (Estatico.ativo) { AoVivo.carregarLocal(); Estatico._fol = null; }
  else await apiFetch("/api/local", {method: "POST", body: JSON.stringify({cep: Regiao.def().cep})});   // app do PC: usa o CEP da região
  apiFetch("/api/local").then(r => r.json()).then(mostrarCep);
  // o que estava na tela era da outra região
  estado.produtos = []; estado.ocultos.clear(); $("#resultado").innerHTML = ""; $("#filtroMercados").innerHTML = ""; precosLista = {};
  if ($("#q").value.trim()) buscar();
  carregarOfertas(); carregarFolhetos(); status();
  if ($("#favoritos").classList.contains("ativo")) carregarFavoritos();
  if ($("#lista").classList.contains("ativo")) { desenharLista(); calcularLista(); }
};

// ---------- status / progresso
let timer = null;
async function status() {
  const s = await apiFetch("/api/status").then(r => r.json()); estado.status = s;
  const t = s.trabalho, rodando = t.tarefa && !t.fim;
  const barra = rodando ? `<div class="info">${esc(t.tarefa)}: ${t.feito}/${t.total}</div><div class="progresso"><i style="width:${t.total ? 100 * t.feito / t.total : 5}%"></i></div>` : "";
  const alvo = t.tarefa.includes("folheto") ? "#progFol" : "#progOf";
  if (rodando) $(alvo).innerHTML = barra;
  $("#btnAtualOf").disabled = $("#btnLerFol").disabled = rodando;
  const total = s.contagens.reduce((a, c) => a + c.n, 0);
  if (s.regioes && !Object.keys(Regiao.lista).length) { Regiao.lista = s.regioes; desenharRegioes(); montarMercadosOf(); }
  $("#resumo").textContent = `${Regiao.redes().size || s.mercados_online.length + s.mercados_folheto.length} redes · ${total.toLocaleString("pt-BR")} preços`;
  $("#avisoIA").innerHTML = s.ia ? "" : `<div class="aviso">A leitura automática de folhetos está desligada: ${esc(s.ia_motivo)}. Veja o LEIAME.md. Sem ela, os folhetos aparecem só como imagens.</div>`;
  if (!rodando && timer) {
    clearInterval(timer); timer = null;
    if (t.erros.length) $(alvo).innerHTML = `<div class="aviso">${t.erros.length} falha(s): ${esc(t.erros.slice(0, 5).join(" · "))}</div>`;
    else $(alvo).innerHTML = "";
    carregarOfertas(); carregarFolhetos();
    if ($("#favoritos").classList.contains("ativo")) carregarFavoritos();
  }
  return s;
}
function acompanhar() { if (!timer) timer = setInterval(status, 1500); status(); }

(async () => {
  await Estatico.iniciar();
  if (AoVivo.ativo) {
    $("#infoBusca").textContent = "Busca ao vivo nas lojas online, com os preços do seu CEP. Folhetos e Ofertas são atualizados todo dia.";
  } else if (Estatico.ativo && Estatico.meta.gerado_em) {
    const d = new Date(Estatico.meta.gerado_em);
    $("#infoBusca").textContent = `Preços coletados em ${d.toLocaleDateString("pt-BR")} às ${d.toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"})}. Atualiza sozinho todo dia.`;
  }
  await Dados.carregar();
  apiFetch("/api/local").then(r => r.json()).then(info => {
    mostrarCep(info);
    // pede o CEP na primeira visita (depois disso, cada região usa o CEP salvo ou o padrão dela)
    let perguntado = false;
    try { perguntado = !!localStorage.getItem("ofertas-cep-perguntado"); localStorage.setItem("ofertas-cep-perguntado", "1"); } catch {}
    if (!info.endereco || (AoVivo.ativo && AoVivo.local?.padrao && !perguntado)) $("#btnCep").click();
  }).catch(() => {});
  const s = await status();
  montarLojasAssai(s);
  desenharRegioes(); montarMercadosOf();
  if (s.trabalho.tarefa && !s.trabalho.fim) acompanhar();
})();
</script>
</body>
</html>
